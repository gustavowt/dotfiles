onboarding = false
[keys]
# Custom user mappings from tmux
next_tab = "ctrl+shift+l"
previous_tab = "ctrl+shift+h"
zoom = "prefix+e"
close_pane = "prefix+x"
toggle_sidebar = "prefix+p"
next_workspace = "ctrl+shift+j"
previous_workspace = "ctrl+shift+k"
next_agent = "ctrl+shift+l"
previous_agent = "ctrl+shift+h"


# Standard tmux default keybindings
new_tab = "prefix+c"
split_horizontal = 'prefix+"'
split_vertical = "prefix+percent"
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
cycle_pane_next = "prefix+o"
detach = "prefix+d"
rename_tab = "prefix+comma"
close_tab = "prefix+ampersand"

[theme]
name = "tokyo-night"
auto_switch = false

[ui.toast]
delivery = "herdr"
